<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>ZoroTask - Task &amp; Reward App</title>
    <meta name="description" content="ZoroTask is a daily tasks, surveys, VIP membership plans, UPI wallet, and referral reward platform." />
    <meta property="og:site_name" content="ZoroTask" />
    <meta property="og:title" content="ZoroTask - Task &amp; Reward App" />
    <meta property="og:description" content="ZoroTask is a daily tasks, surveys, VIP membership plans, UPI wallet, and referral reward platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZoroTask - Task &amp; Reward App" />
    <meta name="twitter:description" content="ZoroTask is a daily tasks, surveys, VIP membership plans, UPI wallet, and referral reward platform." />
  </head>
  <body>
    <script>
      // Instant Android WebView & browser history guard so canGoBack() is NEVER false on launch
      (function() {
        try {
          var hash = window.location.hash || '';
          var initialScreen = hash.replace(/^#\/?/, '').split('?')[0].trim() || 'home';
          if (!window.history.state || !window.history.state.zorotask_guard) {
            window.history.replaceState({ zorotask_guard: true, isRoot: true }, '', '#guard');
            window.history.pushState({ zorotask_app: true, screen: initialScreen }, '', hash || ('#' + initialScreen));
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
