name: Build ZoroTask Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Generate Android Project with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-save --legacy-peer-deps
          npx cap add android
          npx cap copy android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload ZoroTask APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoroTask-Official-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
